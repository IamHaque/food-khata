[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "food-khata"
version = "0.1.0"
description = "Local, resumable Zomato and Swiggy food order history"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["requests>=2.32,<3", "curl_cffi>=0.7,<1", "questionary>=2,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "pytest>=8,<10"]

[project.scripts]
food-khata = "food_khata.cli:main"

[tool.setuptools.packages.find]
include = ["food_khata*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
